[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = . AINDY
addopts = -q --disable-warnings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    postgres: exercises behavior that differs between SQLite and PostgreSQL (FK cascades, JSONB, UUID)
    runtime_only: validates runtime-owned behavior without requiring apps.bootstrap
    integration: full integration suite requiring a live database and external services
    redis: requires a live Redis instance (set REDIS_URL)
    multi_instance: requires fakeredis for cross-instance simulation
    mongo: requires a live MongoDB instance (set MONGO_URL)
    sandbox_escape: adversarial sandbox escape tests — require Docker with Linux containers mode (run with pytest -m sandbox_escape)
env =
    TEST_MODE=true
    ENFORCE_EXECUTION_CONTRACT=true
    AINDY_ASYNC_HEAVY_EXECUTION=false
    DATABASE_URL=sqlite:///:memory:
    AINDY_ALLOW_SQLITE=true
    AINDY_SKIP_MONGO_PING=true
    SKIP_MONGO_PING=true
    MONGO_URL=
    OPENAI_API_KEY=sk-test-key-for-pytest-only

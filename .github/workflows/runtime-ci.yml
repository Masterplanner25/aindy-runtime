name: Runtime CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Runtime Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install ruff==0.15.6

      - name: Lint runtime-owned Python code
        run: python -m ruff check AINDY tests --config AINDY/ruff.toml

  runtime-docs:
    name: Runtime Docs Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate runtime docs frontmatter and ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          required_frontmatter = {"title", "last_verified", "api_version", "status", "owner"}
          docs_root = Path("docs/runtime")
          missing = []

          # DOCS-STALE-1 (closed 2026-08-13). Seven docs declared a last_verified EARLIER
          # than this repo's first commit -- a verification claim about a codebase that did
          # not yet exist. Four had only the extraction commit, so nothing in them had ever
          # been checked against runtime source. This check was the named close trigger and
          # could not be added while those seven were outstanding: it would have red-lined
          # the build on the very docs that prompted it.
          REPO_EPOCH = "2026-05-17"  # 0d5d382 Initial runtime repo extraction

          for path in sorted(docs_root.glob("*.md")):
              text = path.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  missing.append(f"{path}: missing YAML frontmatter")
                  continue

              try:
                  _, frontmatter, _ = text.split("---\n", 2)
              except ValueError:
                  missing.append(f"{path}: malformed YAML frontmatter delimiter")
                  continue

              keys = {
                  line.split(":", 1)[0].strip()
                  for line in frontmatter.splitlines()
                  if ":" in line and not line.strip().startswith("#")
              }

              missing_keys = sorted(required_frontmatter - keys)
              if missing_keys:
                  missing.append(f"{path}: missing frontmatter keys {missing_keys}")
                  continue

              # last_verified must be a plausible ISO date at or after the repo epoch.
              verified = ""
              for line in frontmatter.splitlines():
                  if line.strip().startswith("last_verified:"):
                      verified = line.split(":", 1)[1].strip().strip('"').strip("'")
                      break

              if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", verified):
                  missing.append(
                      f"{path}: last_verified {verified!r} is not a YYYY-MM-DD date"
                  )
              elif verified < REPO_EPOCH:
                  missing.append(
                      f"{path}: last_verified {verified} predates the repo's first commit "
                      f"({REPO_EPOCH}) -- it cannot describe this codebase. Read the doc "
                      f"against source and set a real date; see TECH_DEBT DOCS-STALE-1."
                  )

          if missing:
              print("\n".join(missing))
              sys.exit(1)

          print(f"validated {len(list(docs_root.glob('*.md')))} runtime docs "
                f"(frontmatter keys + last_verified >= {REPO_EPOCH})")
          PY

  native-crate:
    name: Native Crate Build (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # NATIVE-CI-1. The pyo3 memory scorer had NO build anywhere in CI, so cargo
    # bumps (uuid / serde / cc) reported green having never compiled the crate —
    # "green" meant "the Python suite still passes", not "the native path builds".
    # Three dependabot PRs sat blocked on a manual local build because of it.
    #
    # Deliberately NOT path-filtered. If this is ever promoted to a required status
    # check, a `paths:` filter would make it never report on PRs that don't touch the
    # crate, and those PRs could then never merge — the classic required-check-with-
    # path-filter trap. Caching keeps the unconditional run cheap instead.
    #
    # Rust and a C++ toolchain are preinstalled on ubuntu-latest, so this needs no
    # third-party toolchain action (and therefore no extra pinned SHA to maintain).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            AINDY/memory/native/memory_bridge_rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('AINDY/memory/native/memory_bridge_rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Toolchain versions
        run: |
          cargo --version
          rustc --version
          c++ --version

      - name: Build the native scorer
        working-directory: AINDY/memory/native/memory_bridge_rs
        # --locked fails the build if Cargo.lock would need changing. That is precisely
        # the check a dependency bump needs: it proves the lockfile committed in the PR
        # is the one that actually builds, rather than one pip/cargo would silently fix.
        #
        # Build only, no `cargo test`: the crate has no #[test]s, and pyo3's
        # extension-module feature omits libpython, so a test harness would fail to
        # LINK rather than tell us anything about the bump.
        #
        # build.rs also compiles memory_cpp/semantic.cpp through the `cc` crate, so this
        # covers the C++ half too — and `cc` is one of the packages dependabot bumps.
        run: cargo build --locked --release

  runtime-contracts:
    name: Runtime Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint, runtime-docs]

    env:
      ENV: test
      PYTHONPATH: .
      TESTING: "true"
      TEST_MODE: "true"
      DATABASE_URL: "sqlite:///:memory:"
      AINDY_ALLOW_SQLITE: "true"
      AINDY_SKIP_MONGO_PING: "true"
      SKIP_MONGO_PING: "true"
      MONGO_URL: ""
      OPENAI_API_KEY: sk-test-placeholder
      DEEPSEEK_API_KEY: ds-test-placeholder
      SECRET_KEY: ci-runtime-secret-key
      PERMISSION_SECRET: ci-runtime-permission-secret
      AINDY_API_KEY: ci-runtime-api-key
      ALLOWED_ORIGINS: "http://localhost:3000"
      AINDY_BOOT_MODE: runtime-only
      # The crate is built in this job (see the build step below), so a skipped native
      # test here means something broke — fail instead of silently losing the coverage.
      AINDY_REQUIRE_NATIVE_BRIDGE: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-runtime-pip-${{ hashFiles('AINDY/requirements.txt', 'pyproject.toml') }}
          restore-keys: ${{ runner.os }}-runtime-pip-

      - name: Install runtime dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r AINDY/requirements.txt
          python -m pip install -e .[test] --no-deps --no-build-isolation

      - name: Install MCP extra (ECOGAP-4 / G4b — exercises real nodus-mcp + mcp SDK)
        # `mcp<2` mirrors the `[mcp]` extra's cap — see MCP-SDK-2X-1 in TECH_DEBT.md.
        # This step installs the packages directly (not via the extra), so the cap
        # has to be repeated here or CI silently resolves to an incompatible SDK.
        #
        # ★ `nodus-lang` is now pinned here too — the third site NODUS-UPGRADE-1 names.
        # It was implicit before: this step runs after `requirements.txt`, so pip saw a
        # satisfying version already installed and left it alone. That is a property of
        # step ORDER, not of any declaration — `nodus-mcp` itself only asks for
        # `nodus-lang>=4.0.0`, so reordering these steps, or adding `--upgrade`, would
        # silently resolve to whatever is newest on PyPI while the wheel pins something
        # else. Bump this line with the other two.
        run: python -m pip install "nodus-lang==5.9.0" "nodus-mcp>=0.1.3" "mcp>=1.0.0,<2"

      # ── Native scorer: build it HERE so its tests actually execute ──────────────
      #
      # `Native Crate Build (Rust)` compiles the crate but never imports it, so without
      # this step every native and parity test in tests/unit/test_memory_native_scorer.py
      # SKIPS — including the assertions that pin NATIVE-PARITY-1. A skip reads as green.
      #
      # That is the third time this repo has shipped coverage that wasn't: docs claiming
      # suites that never existed (DOCS-COVERAGE-CLAIM-1), suites existing but never
      # collected (CI-MARKER-1), and now suites collected but skipped. Hence
      # AINDY_REQUIRE_NATIVE_BRIDGE below — if this build or the rename ever breaks, the
      # suite goes RED rather than quietly losing the coverage.
      #
      # Cache key matches the Rust job's so the two share a warm target/ dir.
      - name: Cache cargo registry and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            AINDY/memory/native/memory_bridge_rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('AINDY/memory/native/memory_bridge_rs/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build the native scorer and make it importable
        working-directory: AINDY/memory/native/memory_bridge_rs
        # cargo emits a cdylib named lib<crate>.so on Linux; Python's import machinery
        # wants <crate>.so. The same mismatch exists on Windows (.dll vs .pyd) and is the
        # reason a bare `cargo build` never yields an importable module — see
        # NATIVE-DISCOVERY-1. Copy rather than move so the cached target/ stays valid.
        run: |
          cargo build --locked --release
          cp target/release/libmemory_bridge_rs.so target/release/memory_bridge_rs.so
          ls -l target/release/memory_bridge_rs.so

      - name: Check schema contract version is current
        run: python scripts/check_schema_version.py

      - name: Check env-example coverage (advisory)
        # Reports variables in AINDY/ code that are absent from AINDY/.env.example.
        # Advisory only (exit 0) — does not block merge. Gaps appear in CI log.
        # Promote to --strict once the existing gap list is resolved.
        run: python scripts/check_env_example_coverage.py

      - name: Assert runtime code does not import apps
        run: |
          if grep -R -n -E '^\s*(from apps\.|import apps\.|from apps\b|import apps\b)' AINDY --include='*.py'; then
            echo 'Found forbidden apps import in runtime repo.'
            exit 1
          fi

      - name: Verify runtime console entrypoints
        run: |
          python - <<'PY'
          import importlib.metadata as md

          console_scripts = {
              ep.name: ep.value
              for ep in md.entry_points(group="console_scripts")
              if ep.name in {"aindy-runtime"}
          }
          assert console_scripts == {
              "aindy-runtime": "AINDY.runtime_only:main",
          }
          print(console_scripts)
          PY

      - name: Smoke runtime-only version surface
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import AINDY.main as main

          client = TestClient(main.app, raise_server_exceptions=False)
          payload = client.get('/api/version').json()
          runtime = payload['runtime']
          compatibility = payload['compatibility']

          assert client.get('/health').status_code == 200
          assert runtime['boot_mode'] == 'runtime-only'
          assert runtime['boot_profile'] == 'platform-only'
          assert runtime['app_plugins_loaded'] is False
          assert runtime['app_plugin_count'] == 0
          assert compatibility['runtime_package']['name'] == 'aindy-runtime'
          assert compatibility['apps_repo_contract']['recommended_runtime_requirement'] == '>=2.0,<3.0'
          print(payload)
          PY

      - name: Run runtime-only contract suite
        run: >
          python -m pytest
          tests
          -m runtime_only
          -q
          --cov=AINDY
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=35

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-sqlite
          path: coverage.xml

  integration-postgres:
    name: Integration Tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [lint, runtime-docs]

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: aindy_test
          POSTGRES_PASSWORD: aindy_test
          POSTGRES_DB: aindy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENV: test
      PYTHONPATH: .
      TESTING: "true"
      TEST_MODE: "true"
      DATABASE_URL: "postgresql://aindy_test:aindy_test@localhost:5432/aindy_test"
      AINDY_ALLOW_SQLITE: "false"
      AINDY_SKIP_MONGO_PING: "true"
      SKIP_MONGO_PING: "true"
      MONGO_URL: ""
      REDIS_URL: "redis://localhost:6379"
      OPENAI_API_KEY: sk-test-placeholder
      DEEPSEEK_API_KEY: ds-test-placeholder
      SECRET_KEY: ci-integration-secret-key
      PERMISSION_SECRET: ci-integration-permission-secret
      AINDY_API_KEY: ci-integration-api-key
      ALLOWED_ORIGINS: "http://localhost:3000"
      AINDY_BOOT_MODE: runtime-only
      AINDY_ENFORCE_SCHEMA: "false"
      AINDY_ASYNC_HEAVY_EXECUTION: "false"
      AINDY_ENABLE_BACKGROUND_TASKS: "false"
      # NODUS-WARMPOOL-1 is the shipped fix for nodus worker cold-start; it is opt-in
      # (default off), so CI was exercising the path it replaced. This is the only tier
      # that really spawns nodus workers, so it is where the warm pool belongs. The
      # cold path is not abandoned — it remains the pool's fault fallback and is covered
      # by tests/unit/test_nodus_worker_pool.py.
      AINDY_NODUS_WARM_POOL: "1"
      AINDY_NODUS_WARM_PREWARM: "1"
      # Pre-warm is explicitly non-blocking (a background thread off the first
      # get_pool()), so the first execution still races the one-time plugin load while
      # the parity tests hold a session open. That legitimately exceeds the 10s test
      # default and Postgres terminates the backend mid-run — surfacing as
      # `server closed the connection unexpectedly` then PendingRollbackError. 60s
      # clears the load without disabling the guard.
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: "60000"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-integration-pip-${{ hashFiles('AINDY/requirements.txt', 'pyproject.toml') }}
          restore-keys: ${{ runner.os }}-integration-pip-

      - name: Install runtime dependencies and optional test packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r AINDY/requirements.txt
          python -m pip install -e .[test] --no-deps --no-build-isolation
          python -m pip install fakeredis

      - name: Verify schema bootstrap on PostgreSQL
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from AINDY.db.schema_contract import (
              ensure_runtime_schema,
              SCHEMA_STATE_COMPATIBLE,
              SCHEMA_STATE_BLANK_BOOTSTRAP,
          )
          from tests.helpers.runtime import import_runtime_model_registry

          import_runtime_model_registry()

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as conn:
              conn.execute(text("CREATE EXTENSION IF NOT EXISTS vector"))

          report = ensure_runtime_schema(engine, allow_bootstrap=True, allow_reconcile=True)
          assert report.ok, f"Schema bootstrap failed: {report.summary()}"
          assert report.state in (SCHEMA_STATE_COMPATIBLE, SCHEMA_STATE_BLANK_BOOTSTRAP), (
              f"Unexpected schema state: {report.state}"
          )
          print(f"schema_state={report.state} tables={len(report.issues)} summary={report.summary()}")
          PY

      - name: Stamp and apply runtime Alembic migrations
        run: |
          python -m alembic stamp 0001
          python -m alembic upgrade head
          python -m alembic current

      - name: Run integration test suite
        run: >
          python -m pytest
          -c pytest.integration.ini
          -q
          --cov=AINDY
          --cov-report=xml

      # ── Soak: the same suite with the gated flags ON ────────────────────────
      #
      # Eight registry items have "soak, then flip" as their remaining work, and nothing has
      # ever run this suite with any of those flags enabled. The functional tests above prove
      # each mechanism is CORRECT; this step is the only place they run under CONTENTION with
      # the flag on, which is the risk the flags actually carry.
      #
      # ★ Non-blocking on purpose, and this is the part to get right. A soak that can red-line
      # unrelated PRs on its first flake gets disabled within a week, and a disabled check is
      # worse than an advisory one because it still looks present. It reports; it does not gate.
      # Promote it to required only after it has been green across a release window AND has been
      # made to go red on purpose — "it went green" is worth nothing until something has made it
      # fail (see the trusting-a-green-check catalogue).
      #
      # ★ It runs the WHOLE suite, not `-k soak`. The soak tests set their own flags with
      # monkeypatch — they are self-contained and already run in the step above, testing both
      # flag states — so re-running only those with env flags on would be a near-duplicate that
      # measures nothing new. The question this step answers is the other one: does turning the
      # flag on break anything ELSE that was passing.
      #
      # ★ The flag-off control lives INSIDE the soak tests, not here: each one drives the same
      # workload with the gate off and asserts the un-deduplicated result, which is what proves
      # the concurrency is real. Without that, a serialised drive would dedup by accident and
      # the soak would read as evidence while measuring nothing.
      - name: Soak — the WHOLE suite with the gated flags ON (advisory)
        continue-on-error: true
        env:
          AINDY_SYSCALL_IDEMPOTENCY: "true"
          AINDY_TOOL_IDEMPOTENCY: "true"
        run: >
          python -m pytest
          -c pytest.integration.ini
          -q

      - name: Upload integration coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration
          path: coverage.xml

  platform-ui-build:
    name: Platform UI Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: platform/package-lock.json

      - name: Install platform UI dependencies
        working-directory: platform
        run: npm ci

      - name: Build platform UI
        working-directory: platform
        run: npm run build

      - name: Verify dist artifacts
        run: |
          test -f AINDY/platform/dist/index.html
          test -d AINDY/platform/dist/assets
          echo "Platform UI build OK â€” $(du -sh AINDY/platform/dist | cut -f1) total"

      - name: Upload platform UI dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-ui-dist
          path: AINDY/platform/dist/

  package-build:
    name: Runtime Package Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, platform-ui-build]

    env:
      DATABASE_URL: "sqlite:///:memory:"
      AINDY_ALLOW_SQLITE: "true"
      AINDY_SKIP_MONGO_PING: "true"
      SKIP_MONGO_PING: "true"
      MONGO_URL: ""
      OPENAI_API_KEY: sk-test-placeholder
      DEEPSEEK_API_KEY: ds-test-placeholder
      SECRET_KEY: ci-runtime-build-secret
      PERMISSION_SECRET: ci-runtime-build-permission-secret
      AINDY_API_KEY: ci-runtime-build-api-key

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download platform UI dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-ui-dist
          path: AINDY/platform/dist/

      - name: Build and verify package artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[release]
          python -m build
          python -m twine check dist/*

      - name: Upload runtime wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-wheel
          path: dist/aindy_runtime-*.whl

  install-smoke-test:
    name: Install Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [package-build]

    env:
      ENV: test
      TESTING: "true"
      TEST_MODE: "true"
      DATABASE_URL: "sqlite:///:memory:"
      AINDY_ALLOW_SQLITE: "true"
      AINDY_SKIP_MONGO_PING: "true"
      SKIP_MONGO_PING: "true"
      MONGO_URL: ""
      OPENAI_API_KEY: sk-test-placeholder
      DEEPSEEK_API_KEY: ds-test-placeholder
      SECRET_KEY: ci-smoke-secret-key
      PERMISSION_SECRET: ci-smoke-permission-secret
      AINDY_API_KEY: ci-smoke-api-key
      ALLOWED_ORIGINS: "http://localhost:3000"
      AINDY_BOOT_MODE: runtime-only

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install psycopg2 system dependency
        run: sudo apt-get install -y libpq-dev

      - name: Download runtime wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-wheel
          path: dist/

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-smoke-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-smoke-pip-

      - name: Install wheel into clean venv
        run: |
          python -m venv smoke_venv
          smoke_venv/bin/pip install --upgrade pip
          smoke_venv/bin/pip install dist/aindy_runtime-*.whl

      - name: Assert entry points declared correctly
        run: |
          smoke_venv/bin/python - <<'PY'
          import importlib.metadata as md
          eps = {
              ep.name: ep.value
              for ep in md.entry_points(group="console_scripts")
              if ep.name in {"aindy-runtime"}
          }
          expected = {
              "aindy-runtime": "AINDY.runtime_only:main",
          }
          assert eps == expected, f"entry points mismatch: {eps}"
          print("Entry points OK:", eps)
          PY

      - name: Import smoke â€” deployment contract and sandbox surfaces
        run: |
          smoke_venv/bin/python - <<'PY'
          from AINDY.platform_layer.deployment_contract import deployment_contract_summary
          from AINDY.platform_layer.sandbox_runner import sandbox_platform_capability_matrix
          print(deployment_contract_summary())
          print(sandbox_platform_capability_matrix())
          PY

      - name: Assert platform UI dist present in installed package
        run: |
          smoke_venv/bin/python - <<'PY'
          import importlib.metadata, pathlib
          # Use importlib.metadata.files() so we read the installed wheel's RECORD
          # rather than find_spec(), which for namespace packages picks up the
          # source ./AINDY/ checkout directory instead of site-packages/AINDY/.
          pkg_files = importlib.metadata.files("aindy-runtime")
          assert pkg_files is not None, "aindy-runtime not installed in smoke_venv"
          dist_html_ref = next(
              (f for f in pkg_files if "platform/dist/index.html" in str(f)),
              None,
          )
          assert dist_html_ref is not None, (
              "platform/dist/index.html not declared in wheel RECORD â€” "
              "check that platform/dist/** is in pyproject.toml package-data "
              "and that the UI build artifact was downloaded before python -m build"
          )
          dist_html = dist_html_ref.locate()
          assert dist_html.exists(), f"platform/dist/index.html declared in RECORD but missing on disk: {dist_html}"
          dist_assets = dist_html.parent / "assets"
          assert dist_assets.is_dir(), f"platform/dist/assets/ missing: {dist_assets}"
          print(f"Platform UI dist OK: {dist_html.parent}")
          PY

      - name: aindy-runtime sandbox exit code check
        run: |
          smoke_venv/bin/aindy-runtime sandbox; code=$?
          [ "$code" -le 2 ] || { echo "unexpected exit code $code (expected 0, 1, or 2)"; exit 1; }
          echo "aindy-runtime sandbox exited $code (OK)"

name: Runtime CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  runtime-contracts:
    name: Runtime Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ENV: test
      PYTHONPATH: .
      TESTING: "true"
      TEST_MODE: "true"
      DATABASE_URL: sqlite:///:memory:
      AINDY_ALLOW_SQLITE: "true"
      AINDY_SKIP_MONGO_PING: "true"
      SKIP_MONGO_PING: "true"
      MONGO_URL: ""
      OPENAI_API_KEY: sk-test-placeholder
      DEEPSEEK_API_KEY: ds-test-placeholder
      SECRET_KEY: ci-runtime-secret-key
      PERMISSION_SECRET: ci-runtime-permission-secret
      AINDY_API_KEY: ci-runtime-api-key
      ALLOWED_ORIGINS: "http://localhost:3000"
      AINDY_BOOT_MODE: runtime-only

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-runtime-pip-${{ hashFiles('AINDY/requirements.txt', 'pyproject.toml') }}
          restore-keys: ${{ runner.os }}-runtime-pip-

      - name: Install runtime dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r AINDY/requirements.txt
          python -m pip install -e .[test] --no-deps --no-build-isolation

      - name: Assert runtime code does not import apps
        run: |
          if grep -R -n -E '^\s*(from apps\.|import apps\.|from apps\b|import apps\b)' AINDY --include='*.py'; then
            echo 'Found forbidden apps import in runtime repo.'
            exit 1
          fi

      - name: Verify runtime console entrypoints
        run: |
          python - <<'PY'
          import importlib.metadata as md

          console_scripts = {
              ep.name: ep.value
              for ep in md.entry_points(group="console_scripts")
              if ep.name in {"aindy-runtime", "aindy-runtime-api"}
          }
          assert console_scripts == {
              "aindy-runtime": "AINDY.runtime_only:main",
              "aindy-runtime-api": "AINDY.main:main",
          }
          print(console_scripts)
          PY

      - name: Smoke runtime-only version surface
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import AINDY.main as main

          client = TestClient(main.app, raise_server_exceptions=False)
          payload = client.get('/api/version').json()
          runtime = payload['runtime']
          compatibility = payload['compatibility']

          assert client.get('/health').status_code == 200
          assert runtime['boot_mode'] == 'runtime-only'
          assert runtime['boot_profile'] == 'platform-only'
          assert runtime['app_plugins_loaded'] is False
          assert runtime['app_plugin_count'] == 0
          assert compatibility['runtime_package']['name'] == 'aindy-runtime'
          assert compatibility['apps_repo_contract']['recommended_runtime_requirement'] == '>=1.0,<2.0'
          print(payload)
          PY

      - name: Run runtime-only contract suite
        run: >
          python -m pytest
          tests/unit/test_runtime_only_test_fixtures.py
          tests/unit/test_platform_only_startup.py
          tests/unit/test_runtime_packaging.py
          tests/unit/test_runtime_boundary.py
          tests/unit/test_runtime_compatibility_metadata.py
          tests/api/test_version_api.py
          -m runtime_only
          -q

name: Auth Dependency CVE Audit

on:
  pull_request:
    branches: [main]
  push:
    # Without this, the audit gates every PR and never gates the branch it
    # protects. On 2026-08-31 a newly published nltk advisory (PYSEC-2026-3726)
    # turned this check red on an UNCHANGED `main` — no PR was open that
    # morning to report it, and the next scheduled run was six days out. So
    # `main` can sit red on a dependency CVE for up to a week with nothing
    # saying so.
    # Deliberately NOT `paths:`-filtered: a filtered required check never
    # reports on unrelated PRs and blocks them forever (see the branch
    # protection notes in CLAUDE.md).
    branches: [main]
  schedule:
    # Weekly â€” every Monday 08:00 UTC. Catches post-merge CVE disclosures
    # against deps that passed audit at merge time.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install runtime with security extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[security]

      - name: Run pip-audit
        run: |
          # CVE-2024-23342: ecdsa Minerva timing attack â€” no fix released. Accepted 2026-05-25;
          #   not reachable: runtime uses HS256 (HMAC) signing only; ecdsa is a transitive dep of
          #   python-jose that is never exercised by this codebase.
          # PYSEC-2026-97: nltk filestring() path traversal â€” no fix released. Accepted 2026-05-25;
          #   nltk is a transitive dep of textstat; nltk.util.filestring() is never called.
          # GHSA-rf74-v2fm-23pw: nltk JSONTaggedDecoder recursion DoS â€” no fix released. Accepted
          #   2026-05-25; nltk JSON tag decoder is never called by this codebase.
          # PYSEC-2026-597 (CVE-2026-12243): nltk url2pathname() percent-encoded path traversal â€”
          #   no fix released. Accepted 2026-07-02; incomplete-fix follow-up to PYSEC-2026-97.
          #   Not reachable. CORRECTED 2026-09-02 — the original reason said "this codebase never
          #   calls nltk.data.load()/find()", which is true of AINDY/ and FALSE of the dependency
          #   that pulls nltk in: textstat's _get_cmudict.py calls nltk.data.find("corpora/cmudict").
          #   The acceptance still holds and for a better-stated reason — that argument is a
          #   HARDCODED literal, so no attacker-controlled resource name reaches url2pathname().
          #   Kept as a correction rather than a rewrite: the accepted-on date is unchanged, and a
          #   security exemption resting on a claim nobody re-checked is worth more than the
          #   tidier text that hid it.
          # PYSEC-2026-3740 (CVE-2026-81726 / GHSA-8mgp-746c-j5xp): nltk model-artifact APIs treat
          #   caller-controlled model paths as ordinary filenames, bypassing nltk path security —
          #   no fix released (pip-audit reports fix_versions: []). Accepted 2026-09-02. NOT
          #   REACHABLE, verified rather than assumed: `import nltk` has ZERO hits across AINDY/,
          #   tests/ and scripts/; nltk arrives solely as a transitive dep of textstat; and
          #   `TransitionParser` — the named affected component — has ZERO references anywhere in
          #   textstat, which touches nltk only in _get_cmudict.py. Nothing here supplies a model
          #   path at all, let alone a caller-controlled one.
          #   ★ This landed on 3.10.3, the version bumped to hours earlier to clear PYSEC-2026-3726.
          #   Do NOT "fix" it by reverting: 3.10.3 remains strictly better, because that advisory
          #   HAD a fix and this one does not.
          # `set +e` around the call is load-bearing. This step runs under `bash -e`, and
          # `pip-audit ...; AUDIT_EXIT=$?` does NOT protect the command from it — the `;`
          # leaves the failure uncaught, so a findings exit of 1 killed the step before
          # AUDIT_EXIT was ever assigned and every branch below was dead code. The job
          # reported a bare "Process completed with exit code 1" and named neither the
          # package nor the CVE. Any rewrite here must keep the call in a context where a
          # non-zero exit is caught (`set +e`, `if`, `||`).
          set +e
          pip-audit \
            --ignore-vuln CVE-2024-23342 \
            --ignore-vuln PYSEC-2026-97 \
            --ignore-vuln GHSA-rf74-v2fm-23pw \
            --ignore-vuln PYSEC-2026-597 \
            --ignore-vuln PYSEC-2026-3740 \
            --format json --output audit-results.json
          AUDIT_EXIT=$?
          set -e
          if [ "$AUDIT_EXIT" -eq 0 ]; then
            echo "pip-audit: no vulnerabilities found"
          elif [ "$AUDIT_EXIT" -eq 1 ]; then
            python - <<'PY'
          import json, sys
          data = json.loads(open("audit-results.json").read())
          vulnerable = [p for p in data.get("dependencies", []) if p.get("vulns")]
          count = sum(len(p["vulns"]) for p in vulnerable)
          print(f"pip-audit: {count} vulnerabilit{'y' if count == 1 else 'ies'} in {len(vulnerable)} package(s):")
          for pkg in vulnerable:
              for v in pkg["vulns"]:
                  aliases = " ".join(v.get("aliases", []))
                  print(f"  {pkg['name']} {pkg['version']}: {v['id']} {aliases}")
                  print(f"    {v.get('description', '')[:200]}")
                  if v.get("fix_versions"):
                      print(f"    Fix: upgrade to {', '.join(v['fix_versions'])}")
          print()
          print("Response SLA (see docs/runtime/SECURITY_POLICY.md):")
          print("  Critical: patch within 7 days | High: 14 days | Medium: next minor | Low: next major")
          print()
          print("To exempt a known-acceptable finding: add --ignore-vuln <ID> to the pip-audit call.")
          PY
            exit 1
          else
            echo "pip-audit exited $AUDIT_EXIT (unexpected â€” network error or configuration issue)"
            exit "$AUDIT_EXIT"
          fi

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pip-audit-results
          path: audit-results.json
          if-no-files-found: ignore

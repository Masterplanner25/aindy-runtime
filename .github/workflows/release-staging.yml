name: Runtime Release Staging

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-runtime-artifacts:
    name: Build Runtime Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: "sqlite:///:memory:"
      AINDY_ALLOW_SQLITE: "true"
      AINDY_SKIP_MONGO_PING: "true"
      SKIP_MONGO_PING: "true"
      MONGO_URL: ""
      OPENAI_API_KEY: sk-test-placeholder
      DEEPSEEK_API_KEY: ds-test-placeholder
      SECRET_KEY: release-staging-secret
      PERMISSION_SECRET: release-staging-permission-secret
      AINDY_API_KEY: release-staging-api-key

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: platform/package-lock.json

      - name: Build platform UI
        working-directory: platform
        run: npm ci && npm run build

      - name: Verify platform UI dist
        run: |
          test -f AINDY/platform/dist/index.html
          test -d AINDY/platform/dist/assets

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install runtime and build tooling
        run: python -m pip install -e .[release]

      - name: Verify staged version metadata
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          from AINDY._version import __version__
          from AINDY.platform_layer.runtime_compatibility import runtime_repo_compatibility_metadata

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert pyproject["project"]["name"] == "aindy-runtime"
          metadata = runtime_repo_compatibility_metadata()
          assert metadata["runtime_package"]["version"] == __version__
          assert metadata["apps_repo_contract"]["recommended_runtime_requirement"] == ">=1.0,<2.0"
          print({"runtime_version": __version__, "compatibility": metadata["apps_repo_contract"]})
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify artifacts
        run: |
          python -m twine check dist/*
          ls -la dist

      - name: Upload staged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aindy-runtime-dist
          path: dist/*

version: 2
updates:
  # Python (pip) — security and version updates for runtime deps.
  # Primary CVE signal comes from pip-audit in security-audit.yml.
  # Dependabot catches transitive deps that pip-audit may miss against a
  # stale lockfile, and auto-opens PRs for security advisories on PyPI.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # DEP-UPGRADE-DEFERRED-1: the OpenTelemetry packages are version-locked —
      # opentelemetry-sdk==X hard-requires opentelemetry-api==X — so a single-package
      # bump can never resolve. Three PRs died proving it (#251, #254, #307), each
      # failing with:
      #     Collecting opentelemetry-api==1.42.1 (from aindy-runtime==1.10.2)
      #     ERROR: ResolutionImpossible
      # Grouping is not noise reduction here; it is the only shape in which an otel
      # bump can merge at all.
      #
      # The pattern deliberately covers the instrumentation packages too, which track
      # a SEPARATE version line (opentelemetry-instrumentation-fastapi==0.63b1 against
      # a 1.42.1 core). Different numbers, same release train — they must move together.
      opentelemetry:
        patterns:
          - "opentelemetry-*"

      # pydantic and pydantic-core are the same shape as the otel cluster above:
      # pydantic X hard-pins `pydantic-core==Y` with `==`, so a solo pydantic-core
      # bump can never resolve. #575 proved it — every install-shaped job died with
      #     pydantic 2.13.4 depends on pydantic-core==2.46.4
      #     aindy-runtime 2.9.0 depends on pydantic_core==2.48.0
      #     ERROR: ResolutionImpossible
      # and there was no fix to write: no released pydantic consumed 2.48.0 at all
      # (2.13.5, the newest, still wanted 2.46.5). pydantic-core is published on its
      # own cadence and runs AHEAD of the pydantic that will consume it, so ungrouped
      # it produces unmergeable PRs on a schedule. Grouped, the pair arrives only when
      # a pydantic release exists to anchor it.
      #
      # ★ CORRECTION 2026-09-08, same day, by #584 — the line above OVER-CLAIMS and is left
      # standing so the error is legible. Grouping does NOT make the pair arrive anchored.
      # Dependabot resolves each member to its own latest INDEPENDENTLY and merely bundles
      # the result into one PR: #584 shipped `pydantic==2.13.5` beside `pydantic_core==2.48.0`
      # and died with the identical `ResolutionImpossible` that #575 did. What grouping buys
      # is ONE failing PR instead of two, and one place to hand-align — not a resolvable bump.
      # DEP-UPGRADE-DEFERRED-1 already said exactly this about the otel cluster ("grouping is
      # necessary but not sufficient — dependabot resolves each package independently, so
      # hand-align and verify with `pip install --dry-run`") and it was not applied here.
      # Expect to hand-align every pydantic bump; the group is where you do it, not a fix.
      #
      # pydantic-settings is deliberately NOT here: it depends on a pydantic RANGE,
      # not an `==` pin, so it resolves on its own and is not part of this train.
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"
          - "pydantic_core"

  # GitHub Actions — keeps pinned action SHAs up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # npm — Platform SPA build/runtime deps (vite, react-router, babel, …).
  # Lockfile lives in platform/; security alerts here have no auto-PR path
  # without this entry.
  - package-ecosystem: "npm"
    directory: "/platform"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # react and react-dom are released in lockstep and are expected to match at
      # runtime. Ungrouped they arrive as two PRs for one upgrade (#309 + #311 were
      # both 19.2.7 -> 19.2.8), and merging one leaves the pair briefly mismatched.
      # Exact names, not "react*" — that would swallow react-router-dom, which is on
      # its own release train and currently blocked upstream on an @aindy/ui-kit peer
      # range (see #312).
      react:
        patterns:
          - "react"
          - "react-dom"

  # Cargo — optional Rust native memory scorer (pyo3, …).
  - package-ecosystem: "cargo"
    directory: "/AINDY/memory/native/memory_bridge_rs"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

version: 2
updates:
  # Python (pip) — security and version updates for runtime deps.
  # Primary CVE signal comes from pip-audit in security-audit.yml.
  # Dependabot catches transitive deps that pip-audit may miss against a
  # stale lockfile, and auto-opens PRs for security advisories on PyPI.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # DEP-UPGRADE-DEFERRED-1: the OpenTelemetry packages are version-locked —
      # opentelemetry-sdk==X hard-requires opentelemetry-api==X — so a single-package
      # bump can never resolve. Three PRs died proving it (#251, #254, #307), each
      # failing with:
      #     Collecting opentelemetry-api==1.42.1 (from aindy-runtime==1.10.2)
      #     ERROR: ResolutionImpossible
      # Grouping is not noise reduction here; it is the only shape in which an otel
      # bump can merge at all.
      #
      # The pattern deliberately covers the instrumentation packages too, which track
      # a SEPARATE version line (opentelemetry-instrumentation-fastapi==0.63b1 against
      # a 1.42.1 core). Different numbers, same release train — they must move together.
      opentelemetry:
        patterns:
          - "opentelemetry-*"

      # pydantic / pydantic-core — RESOLVED 2026-09-08 by removing the pin, not by grouping.
      #
      # History, kept because two dead PRs and a wrong fix are the reason this reads the way it
      # does. `pydantic X` hard-pins `pydantic-core==Y` with `==`, and we pinned BOTH. #575
      # (solo core bump) died with ResolutionImpossible. #583 grouped them on the theory that a
      # group arrives anchored — WRONG, and #584 refuted it the same day by shipping
      # `pydantic==2.13.5` beside `pydantic_core==2.48.0`. #590 then failed a third way: with
      # pydantic already newest, the group had one member to move and bumped core alone.
      #
      # ★ A group bumps whichever members have updates, EACH TO ITS OWN LATEST. For an
      # `==`-linked pair that is valid only in the coincidence where the newest core is exactly
      # the one the newest pydantic pins. Off that coincidence it fails whether it moves one
      # member or both — so grouping could never have fixed this.
      #
      # ★★ The actual cause was upstream of dependabot: pydantic-core's version IS NOT OURS TO
      # CHOOSE. pydantic fixes it with `==`, so pinning it ourselves pinned a DERIVED value, and
      # a derived value pinned by hand can only ever drift from the thing deriving it. The pin
      # is gone from pyproject.toml and AINDY/requirements.txt; pip resolves core from pydantic.
      # Reproducibility is unchanged — it comes from pydantic's own `==`, not from our copy of it.
      #
      # ★ Do NOT re-add `pydantic_core==` to either file. If it ever comes back, this group is
      # the guard rail that at least makes the pair move in one PR; it is not a fix on its own.
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"
          - "pydantic_core"

  # GitHub Actions — keeps pinned action SHAs up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # npm — Platform SPA build/runtime deps (vite, react-router, babel, …).
  # Lockfile lives in platform/; security alerts here have no auto-PR path
  # without this entry.
  - package-ecosystem: "npm"
    directory: "/platform"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # react and react-dom are released in lockstep and are expected to match at
      # runtime. Ungrouped they arrive as two PRs for one upgrade (#309 + #311 were
      # both 19.2.7 -> 19.2.8), and merging one leaves the pair briefly mismatched.
      # Exact names, not "react*" — that would swallow react-router-dom, which is on
      # its own release train and currently blocked upstream on an @aindy/ui-kit peer
      # range (see #312).
      react:
        patterns:
          - "react"
          - "react-dom"

  # Cargo — optional Rust native memory scorer (pyo3, …).
  - package-ecosystem: "cargo"
    directory: "/AINDY/memory/native/memory_bridge_rs"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

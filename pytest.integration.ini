[pytest]
testpaths = tests/integration
pythonpath = . AINDY
addopts = -q --disable-warnings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: full integration suite (database, Redis, Mongo)
    redis: requires a live Redis instance — set REDIS_URL before running
    multi_instance: requires fakeredis for cross-instance simulation
    mongo: requires a live MongoDB instance — set MONGO_URL before running
    postgres: exercises PostgreSQL-specific behavior
    runtime_only: validates runtime-owned behavior without apps.bootstrap
    sandbox_escape: adversarial sandbox escape tests — require Docker with Linux containers mode
# Sandbox escape suite (run separately — requires Docker, no database needed):
#   pytest -m sandbox_escape -v
#   SANDBOX_ESCAPE_IMAGE=python:3.11-alpine pytest tests/sandbox/ -v
# Produces: tests/sandbox/sandbox_escape_results.json
# env blocks take effect only when pytest-env is installed.
# Without it, set these in your shell or via docker-compose.test.yml before running.
# DATABASE_URL must be set to a PostgreSQL URL by the calling environment.
env =
    AINDY_ALLOW_SQLITE=false
    AINDY_SKIP_MONGO_PING=false
    MONGO_URL=mongodb://localhost:27017
    AINDY_BOOT_MODE=runtime-only
    TEST_MODE=true
    ENV=test
    TESTING=true
    AINDY_ASYNC_HEAVY_EXECUTION=false
    AINDY_ENABLE_BACKGROUND_TASKS=false
    AINDY_ENFORCE_SCHEMA=false
    SECRET_KEY=ci-integration-secret-key
    PERMISSION_SECRET=ci-integration-permission-secret
    AINDY_API_KEY=ci-integration-api-key
    OPENAI_API_KEY=sk-test-placeholder
    DEEPSEEK_API_KEY=ds-test-placeholder
    ALLOWED_ORIGINS=http://localhost:3000

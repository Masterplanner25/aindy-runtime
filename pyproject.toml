[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aindy-runtime"
dynamic = ["version"]
description = "Self-hostable AI agent execution runtime — syscall contract, DAG flows, vector memory, plugin registry"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Shawn Knight", email = "shawnknight@the-master-plan.com" }]
keywords = ["runtime", "fastapi", "agents", "flows", "memory", "plugins", "aindy", "llm"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "annotated-doc==0.0.4",
  "annotated-types==0.7.0",
  "anyio==4.14.1",
  "apscheduler==3.11.3",
  "bcrypt==4.0.1",
  "certifi==2026.6.17",
  "charset-normalizer==3.4.8",
  "click==8.4.2",
  "colorama==0.4.6",
  "distro==1.9.0",
  "dnspython==2.8.0",
  "fastapi==0.138.1",
  "fastapi-cache2==0.2.2",
  "greenlet==3.5.3",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "idna==3.18",
  "jinja2==3.1.6",
  "jiter==0.11.1",
  "joblib==1.5.3",
  "alembic==1.17.0",
  "Mako==1.3.12",
  "MarkupSafe==3.0.3",
  "nltk==3.10.0",
  "nodus-lang==4.1.0",
  "numpy==2.4.6",
  "limits==5.8.0",
  "openai==2.46.0",
  "packaging>=24.0",
  "opentelemetry-api==1.42.1",
  "opentelemetry-exporter-otlp-proto-grpc==1.42.1",
  "opentelemetry-instrumentation-fastapi==0.63b1",
  "opentelemetry-sdk==1.44.0",
  "passlib==1.7.4",
  "pendulum==3.2.0",
  "pgvector==0.4.2",
  "prometheus-fastapi-instrumentator==8.0.2",
  "psycopg2==2.9.12",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "pydantic_core==2.46.4",
  "pymongo==4.16.0",
  "pyphen==0.17.2",
  "python-dateutil==2.9.0.post0",
  "python-dotenv==1.2.2",
  "ecdsa==0.19.2",
  "python-jose==3.5.0",
  "cryptography==48.0.1",
  "python-json-logger==4.1.0",
  "redis==8.0.1",
  "regex==2026.6.28",
  "requests==2.34.2",
  "six==1.17.0",
  "slowapi==0.1.10",
  "sniffio==1.3.1",
  "SQLAlchemy==2.0.51",
  "starlette==1.3.1",
  "tenacity==9.1.4",
  "textstat==0.7.13",
  "tqdm==4.68.2",
  "typing-inspection==0.4.2",
  "typing_extensions==4.16.0",
  "tzdata==2026.3",
  "tzlocal==5.4.4",
  "urllib3==2.7.0",
  "uvicorn==0.49.0",
]

[project.urls]
Homepage = "https://github.com/Masterplanner25/aindy-runtime"
Documentation = "https://github.com/Masterplanner25/aindy-runtime/tree/main/docs/runtime"
Source = "https://github.com/Masterplanner25/aindy-runtime"
Issues = "https://github.com/Masterplanner25/aindy-runtime/issues"

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.1.0",
  "pytest-mock==3.15.1",
  "respx==0.23.1",
]
release = [
  "build==1.5.0",
  "twine==6.2.0",
]
embeddings-local = [
  # ECOGAP-3 Phase 1: offline/air-gapped memory embeddings via a local model
  # (AINDY_EMBEDDING_PROVIDER=local). Not in the base wheel — keeps it lean and avoids
  # a torch dependency for the OpenAI-default deployment. Install with:
  # pip install aindy-runtime[embeddings-local]
  "sentence-transformers>=2.2.0",
]
anthropic = [
  # ECOGAP-3 Phase 2: Anthropic (Claude) as an LLM provider (LLM_PROVIDER=anthropic),
  # via the official SDK. Not in the base wheel. Azure OpenAI needs no extra (it reuses
  # the openai SDK). Install with: pip install aindy-runtime[anthropic]
  "anthropic>=0.40.0",
]
mcp = [
  # MCP interop (ECOGAP-4 / G4b client + server). `mcp` is listed explicitly because
  # nodus-mcp treats the official SDK as optional and does not pull it in, but the
  # MCPClientAdapter SSE transport requires it. Install with: pip install aindy-runtime[mcp]
  # >=0.1.2 required for the server-side SSE transport (/messages/ mount, #7) and the
  # per-session auth_hook context (headers/session, #8) that MEB-3a multi-tenant uses.
  "nodus-mcp>=0.1.2",
  # Capped below 2.0.0 (MCP-SDK-2X-1): nodus-mcp 0.1.2 — the latest release — is built
  # against the 1.x low-level server API and calls `Server.list_tools()`, which mcp 2.0.0
  # removed. With mcp 2.0.0 installed, constructing a `NodusServer` raises
  # `AttributeError: 'Server' object has no attribute 'list_tools'`, so the extra is
  # broken at import-of-server time, not merely in tests. Lift the cap when a nodus-mcp
  # release targets the 2.x API.
  "mcp>=1.0.0,<2",
  # SSE server transport (aindy-runtime mcp-server --transport sse).
  "uvicorn>=0.30.0",
  "starlette>=0.37.0",
]
security = [
  # pip-audit scans installed deps against OSV. Run with: pip install -e .[security]
  "pip-audit>=2.7.0",
  # Auth-adjacent floors — minimum acceptable versions for CVE-monitored packages.
  # The main dependencies list carries exact pins for reproducibility; these floors
  # ensure a downgrade is flagged if the main pin is ever lowered below a known-safe version.
  "bcrypt>=4.0.1",
  "passlib>=1.7.4",
  "python-jose>=3.5.0",
  # setuptools>=83.0.0 clears CVE-2026-59890 / PYSEC-2026-3447 (FileList MANIFEST.in
  # glob matching, packaging-time only). Fix released, so we upgrade rather than ignore;
  # this floor also forces the pip-audit env off the runner's ambient 79.0.1.
  "setuptools>=83.0.0",
]

[project.scripts]
aindy-runtime = "AINDY.runtime_only:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "AINDY._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["AINDY*"]
namespaces = true

[tool.setuptools.package-data]
"AINDY" = ["*.json", "**/*.json", "platform/dist/**"]

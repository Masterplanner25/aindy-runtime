[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aindy-runtime"
dynamic = ["version"]
description = "Self-hostable AI agent execution runtime — syscall contract, DAG flows, vector memory, plugin registry"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Shawn Knight", email = "shawnknight@the-master-plan.com" }]
keywords = ["runtime", "fastapi", "agents", "flows", "memory", "plugins", "aindy", "llm"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "annotated-doc==0.0.4",
  "annotated-types==0.7.0",
  "anyio==4.13.0",
  "apscheduler==3.11.2",
  "bcrypt==4.0.1",
  "certifi==2026.5.20",
  "charset-normalizer==3.4.4",
  "click==8.4.1",
  "colorama==0.4.6",
  "distro==1.9.0",
  "dnspython==2.8.0",
  "fastapi==0.137.1",
  "fastapi-cache2==0.2.2",
  "greenlet==3.5.1",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "idna==3.18",
  "jinja2==3.1.6",
  "jiter==0.11.1",
  "joblib==1.5.3",
  "alembic==1.17.0",
  "Mako==1.3.12",
  "MarkupSafe==3.0.3",
  "nltk==3.9.4",
  "nodus-lang==4.0.3",
  "numpy==2.4.6",
  "limits==5.8.0",
  "openai==2.6.0",
  "packaging>=24.0",
  "opentelemetry-api==1.42.1",
  "opentelemetry-exporter-otlp-proto-grpc==1.42.1",
  "opentelemetry-instrumentation-fastapi==0.63b1",
  "opentelemetry-sdk==1.42.1",
  "passlib==1.7.4",
  "pendulum==3.2.0",
  "pgvector==0.4.2",
  "prometheus-fastapi-instrumentator==8.0.0",
  "psycopg2==2.9.12",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "pydantic_core==2.46.4",
  "pymongo==4.16.0",
  "pyphen==0.17.2",
  "python-dateutil==2.9.0.post0",
  "python-dotenv==1.2.2",
  "ecdsa==0.19.2",
  "python-jose==3.5.0",
  "python-json-logger==4.1.0",
  "redis==8.0.0",
  "regex==2025.9.18",
  "requests==2.34.2",
  "six==1.17.0",
  "slowapi==0.1.9",
  "sniffio==1.3.1",
  "SQLAlchemy==2.0.50",
  "starlette==1.3.1",
  "tenacity==9.1.4",
  "textstat==0.7.10",
  "tqdm==4.68.2",
  "typing-inspection==0.4.2",
  "typing_extensions==4.15.0",
  "tzdata==2026.2",
  "tzlocal==5.3.1",
  "urllib3==2.7.0",
  "uvicorn==0.38.0",
]

[project.urls]
Homepage = "https://github.com/Masterplanner25/aindy-runtime"
Documentation = "https://github.com/Masterplanner25/aindy-runtime/tree/main/docs/runtime"
Source = "https://github.com/Masterplanner25/aindy-runtime"
Issues = "https://github.com/Masterplanner25/aindy-runtime/issues"

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "pytest-mock==3.15.1",
]
release = [
  "build==1.3.0",
  "twine==6.2.0",
]
security = [
  # pip-audit scans installed deps against OSV. Run with: pip install -e .[security]
  "pip-audit>=2.7.0",
  # Auth-adjacent floors — minimum acceptable versions for CVE-monitored packages.
  # The main dependencies list carries exact pins for reproducibility; these floors
  # ensure a downgrade is flagged if the main pin is ever lowered below a known-safe version.
  "bcrypt>=4.0.1",
  "passlib>=1.7.4",
  "python-jose>=3.5.0",
]

[project.scripts]
aindy-runtime = "AINDY.runtime_only:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "AINDY._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["AINDY*"]
namespaces = true

[tool.setuptools.package-data]
"AINDY" = ["*.json", "**/*.json", "platform/dist/**"]

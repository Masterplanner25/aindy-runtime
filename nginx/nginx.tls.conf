# A.I.N.D.Y. Runtime — nginx reverse proxy (production TLS)
#
# Terminates TLS at nginx, redirects HTTP → HTTPS, and proxies all
# traffic to the api container. Use for direct public deployments on a VM.
#
# ─── Setup checklist ─────────────────────────────────────────────────────
#
# 1. Obtain a certificate (Let's Encrypt recommended):
#
#      # Install certbot on the host, then:
#      certbot certonly --standalone -d yourdomain.com
#      # Certs are written to /etc/letsencrypt/live/yourdomain.com/
#
# 2. Mount certs into the nginx container. Add to docker-compose.override.yml:
#
#      services:
#        nginx:
#          volumes:
#            - /etc/letsencrypt/live/yourdomain.com/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
#            - /etc/letsencrypt/live/yourdomain.com/privkey.pem:/etc/nginx/certs/privkey.pem:ro
#
# 3. Replace `server_name _;` in the 443 block with your actual domain:
#      server_name yourdomain.com;
#
# 4. Set in AINDY/.env:
#      ALLOWED_ORIGINS=https://yourdomain.com
#
# 5. Start with TLS config:
#      NGINX_CONF=nginx.tls.conf docker compose --profile proxy up -d
#
# ─── For managed-cert deployments (AWS ACM, GCP LB, Cloudflare) ──────────
# Terminate TLS at the load balancer and use nginx.conf (plain HTTP) behind
# it. The load balancer sets X-Forwarded-Proto: https, which FastAPI reads
# for OpenAPI URL generation and redirect URIs.
#
# ─── Certificate renewal ─────────────────────────────────────────────────
# Let's Encrypt certs expire every 90 days. Add a cron job on the host:
#   0 3 * * * certbot renew --quiet && docker compose exec nginx nginx -s reload

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/plain
        text/css
        text/javascript
        text/xml;

    # TLS settings — TLSv1.2 minimum, prefer forward-secret ciphers
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # WebSocket upgrade support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name _;   # replace with your domain, e.g.: server_name yourdomain.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                              always;
        add_header X-Frame-Options           "SAMEORIGIN"                           always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;

        location / {
            proxy_pass         http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
        }
    }
}

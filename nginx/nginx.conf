# A.I.N.D.Y. Runtime — nginx reverse proxy (plain HTTP)
#
# Use for:
#   - Local network deployments
#   - Deployments behind a TLS-terminating load balancer (AWS ALB, GCP LB, Cloudflare)
#     that forwards plain HTTP to the backend
#
# For direct public HTTPS deployments, use nginx.tls.conf instead.
#
# Usage:
#   docker compose --profile proxy up -d
#
# All traffic is forwarded to the api container on port 8000. FastAPI serves
# both the HTTP API and the platform SPA — no separate frontend container.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/plain
        text/css
        text/javascript
        text/xml;

    # WebSocket upgrade support (for future realtime features)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        proxy_read_timeout    120s;
        proxy_connect_timeout  10s;

        location / {
            proxy_pass         http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
        }
    }
}

# A.I.N.D.Y. Runtime — production port overrides
#
# Removes all host port bindings so no service is reachable from outside the
# compose network. Use this overlay whenever the proxy profile (nginx) handles
# external traffic — only ports 80 and 443 on the nginx container are exposed.
#
# Usage:
#   # With nginx (recommended for cloud/VM):
#   NGINX_CONF=nginx.tls.conf \
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --profile full --profile proxy up -d
#
#   # Without nginx (direct access, own firewall):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile full up -d
#
# Requires Docker Compose v2.24+ (supports the !reset merge tag).
# Check your version: docker compose version

services:
  postgres:
    # Remove host binding — DB reachable only within the compose network.
    ports: !reset []

  redis:
    ports: !reset []

  mongo:
    ports: !reset []

  api:
    # Remove host binding — nginx handles all external traffic on 80/443.
    # Direct access to :8000 from outside the host is blocked.
    ports: !reset []
    environment:
      # Production overlay enforces distributed mode so the API dispatches
      # to the Redis queue and the worker picks up jobs durably.
      # Thread mode (the .env.example default) is dev-only; jobs are lost
      # on restart and the 100-job queue cap applies.
      EXECUTION_MODE: distributed

  worker:
    # Metrics endpoint (:8001) is internal-only when using this overlay.
    # Prometheus reaches it via the compose network; no external exposure needed.
    ports: !reset []
